# Build PSS binaries for all supported platforms
# Triggered on release tags, submodule pointer changes, CI workflow changes, or manually.
# NOTE: submodule SHA bumps do NOT modify .gitmodules — they live in the tree object.
# The `rust` path entry below matches the submodule pointer as a single-file change.

name: Build Multi-Platform Binaries

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']  # fire on every release tag so binaries are always rebuilt
    paths:
      - '.gitmodules'
      - 'rust'  # submodule pointer (stored in tree, distinct from rust/** globbing)
      - 'rust/**'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [rust-source-updated]

# Serialize concurrent runs (artifact upload integrity).
concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: every job only ever READS the repo. Binaries ship as
# workflow artifacts / release assets — no job writes to the repo, so no
# job holds a write token to steal.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_SOURCE: rust/skill-suggester
  # Cargo workspace root — binaries go to rust/target/, not rust/skill-suggester/target/
  WORKSPACE_TARGET: rust/target
  BIN_DIR: bin

jobs:
  # Native macOS builds (cannot use cross for macOS)
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            binary: pss-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-15
            binary: pss-darwin-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # This job never pushes. Without this, checkout leaves the ambient
          # GITHUB_TOKEN in .git/config where any later build step (or a
          # compromised crate build script) could read and reuse it.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-25
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        working-directory: ${{ env.RUST_SOURCE }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy binary to bin/
        run: |
          cp "${{ env.WORKSPACE_TARGET }}/${{ matrix.target }}/release/pss" \
             "${{ env.BIN_DIR }}/${{ matrix.binary }}"
          chmod +x "${{ env.BIN_DIR }}/${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: ${{ env.BIN_DIR }}/${{ matrix.binary }}

  # Cross-compiled builds (Linux, Windows)
  build-cross:
    runs-on: ubuntu-latest
    # `cargo install cross` + Docker image pulls dominate this job's runtime.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            binary: pss-linux-x86_64
          - target: aarch64-unknown-linux-musl
            binary: pss-linux-arm64
          - target: x86_64-pc-windows-gnu
            binary: pss-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Same reasoning as build-macos: read-only job, no token left on disk.
          # This job additionally runs third-party code under `cross` in Docker.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-25
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build with cross
        working-directory: ${{ env.RUST_SOURCE }}
        # DOCKER_DEFAULT_PLATFORM=linux/amd64 is required when the runner is
        # Apple Silicon (cross images are x86_64 only). It's a no-op on x86_64
        # hosts — set it here defensively so the workflow works on any runner.
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: cross build --release --target ${{ matrix.target }}

      - name: Copy binary to bin/
        run: |
          src="${{ env.WORKSPACE_TARGET }}/${{ matrix.target }}/release/pss"
          # Windows binaries have .exe extension in the release dir
          if [[ "${{ matrix.binary }}" == *.exe ]]; then
            src="${src}.exe"
          fi
          cp "$src" "${{ env.BIN_DIR }}/${{ matrix.binary }}"
          chmod +x "${{ env.BIN_DIR }}/${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: ${{ env.BIN_DIR }}/${{ matrix.binary }}

  # TRDD-PHQHS58T: keyless-sign the RELEASE ASSETS with the runner's OIDC
  # identity. Signing the release's own bytes (not CI build artifacts) is
  # load-bearing: publish.py builds on the dev laptop, so CI artifacts are a
  # DIFFERENT byte-set — a signature over them would never match the shipped
  # files. Signing what the release actually serves means one byte-set is
  # authoritative. Runs AFTER upload_release_assets (publish.py finishes the
  # release before the tag's build run reaches this job — the wait handles
  # the race). Ref regexp in G3 pins refs/tags/ because a tag-triggered
  # run's OIDC ref claim is the TAG, not refs/heads/main.
  sign-release:
    needs: [build-macos, build-cross]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # OIDC for keyless signing — the whole point
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Wait for release assets, then sign them all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # publish.py uploads 12 assets after the tag push; poll up to 10 min
          deadline=$((SECONDS + 600))
          count=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
              [ "$count" -ge 12 ] && break
            fi
            sleep 30
          done
          [ "$count" -ge 12 ] || { echo "::error::release $TAG never reached 12 assets"; exit 1; }

          mkdir -p assets bundles
          gh release download "$TAG" -D assets
          # Sign every asset: 10 binaries + manifest + tarball (the manifest
          # IS the trust anchor — leaving it unsigned would leave the exact
          # thing sha-vs-manifest relies on outside the signature's cover).
          for f in assets/*; do
            name="$(basename "$f")"
            cosign sign-blob --yes \
              --bundle "bundles/${name}.sigstore.json" \
              "$f" > /dev/null 2>&1
            echo "signed ${name}"
          done
          # Bundles ship as RELEASE ASSETS, not workflow artifacts: artifacts
          # are retention-capped (90d default on hosted repos) and expiry
          # would turn G3's nightly permanently red on a fine release. A
          # release asset lives as long as the release. The fetcher is
          # name-addressed, so the extra assets are invisible to it.
          # NO separate checksums.txt: every bundle embeds the sha256 of the
          # bytes it signs, and G3 checks sha-vs-manifest independently —
          # do not remove --bundle without re-reading TRDD-PHQHS58T.
          # bundles/ is runtime-created above (mkdir + per-asset writes) — never
          # a repo-tree path. find+mapfile instead of a shell glob: a zero match
          # yields an empty array (no pipefail/ls exit-2 abort), and the count
          # guard turns a partial cosign failure into a loud error instead of a
          # silently-shipped subset.
          [ -d bundles ] || { echo "::error::bundles/ missing — sign loop did not run?"; exit 1; }
          mapfile -t bundle_files < <(find bundles -maxdepth 1 -name '*.sigstore.json' | sort)
          [ "${#bundle_files[@]}" -ge 12 ] || { echo "::error::expected >=12 bundles, found ${#bundle_files[@]}"; exit 1; }
          gh release upload "$TAG" "${bundle_files[@]}" --clobber
          echo "uploaded ${#bundle_files[@]} bundles to release $TAG"
          echo "uploaded $(ls bundles | wc -l | tr -d ' ') bundles to release $TAG"
