name: Plugin Validation

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
    paths:
      - '.claude-plugin/**'
      - 'agents/**'
      - 'commands/**'
      - 'skills/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'rust'  # submodule pointer file (single entry, not rust/)
      - 'rust/**'
      - 'docs/**'
      - 'README.md'
      - 'VERSION'
      - 'CHANGELOG.md'
      - '*.mcp.json'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# The repository default is `default_workflow_permissions: write`, so without
# this block the job runs with a read/write token across every scope. It only
# needs to read the checkout — and the validate step fetches and executes
# third-party code at runtime (`uvx --from git+https://...`), so a wider token
# than the job needs is a live supply-chain exposure, not a theoretical one.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Without this the job inherits the 360-minute default; a hung uvx resolve
    # would burn six hours of Actions minutes before anything noticed.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The validate step below runs `uvx --from git+https://...`, which
          # fetches and executes third-party code in this job. checkout leaves
          # the token in .git/config by default, so anything that code runs
          # could read it. This job only ever reads the tree — it never pushes.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Validate plugin
        run: |
          echo "=== Plugin Validation (CPV remote, strict mode) ==="
          echo ""

          # Run CPV remote validation via uvx (no local scripts needed)
          # Exit codes: 0=pass, 1=CRITICAL, 2=MAJOR, 3=MINOR
          set +e
          uvx --from git+https://github.com/Emasoft/claude-plugins-validation \
              --with pyyaml \
              cpv-remote-validate plugin . --verbose
          exit_code=$?
          set -e

          echo ""
          if [ $exit_code -eq 0 ]; then
            echo "=== Validation PASSED ==="
            exit 0
          else
            echo "=== Validation FAILED (exit code: $exit_code) ==="
            exit $exit_code
          fi
