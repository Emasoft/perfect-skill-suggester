name: Verify Release Assets

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'bin/manifest.json'
      - 'scripts/pss_fetch_binaries.py'
      - '.github/workflows/verify-release-assets.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Read release tag from manifest
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(jq -r '.release_tag' bin/manifest.json)"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Wait for all release assets to be uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # publish.py creates the release first, then CI's sign-release job
          # uploads its bundles as workflow ARTIFACTS (not release assets —
          # release assets stay 12: 10 binaries + manifest +
          # pss-binaries-<version>.tar.gz). A
          # run triggered right after a release can legitimately race the
          # upload, so poll instead of failing on the first look.
          # A push that lands bin/manifest.json can precede the tag's GitHub
          # release (publish.py pushes the tag+release at the very end); on
          # push events only, tolerate a not-yet-published release and let
          # the nightly run verify it.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "::notice::release ${TAG} not published yet; nightly run will verify"
              exit 0
            fi
            echo "::error::release ${TAG} does not exist"
            exit 1
          fi
          deadline=$((SECONDS + 600))
          count=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
            if [ "$count" -ge 12 ]; then
              echo "release $TAG has $count assets"
              exit 0
            fi
            sleep 30
          done
          echo "::error::release $TAG never reached 12 assets (saw $count after 10 minutes)"
          exit 1

      - name: Verify each binary asset against the manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          fail=0

          while IFS=$'\t' read -r name expected_sha expected_size; do
            asset="${tmpdir}/${name}"
            if ! gh release download "$TAG" -p "$name" -D "$tmpdir" 2>/tmp/dl-err.txt; then
              echo "::error::failed to download release asset ${name}: $(cat /tmp/dl-err.txt)"
              fail=1
              continue
            fi

            actual_sha="$(sha256sum "$asset" | awk '{print $1}')"
            actual_size="$(stat -c%s "$asset")"

            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::${name}: release asset sha256 mismatch (expected ${expected_sha}, got ${actual_sha})"
              fail=1
            fi
            if [ "$actual_size" != "$expected_size" ]; then
              echo "::error::${name}: release asset size mismatch (expected ${expected_size}, got ${actual_size})"
              fail=1
            fi

            if [ -f "bin/${name}" ]; then
              tracked_sha="$(sha256sum "bin/${name}" | awk '{print $1}')"
              if [ "$tracked_sha" != "$expected_sha" ]; then
                echo "::error::${name}: git-tracked bin/${name} sha256 does not match manifest (expected ${expected_sha}, got ${tracked_sha})"
                fail=1
              fi
            fi
          done < <(jq -r '.binaries | to_entries[] | [.key, .value.sha256, .value.size] | @tsv' bin/manifest.json)

          rm -rf "$tmpdir"
          exit "$fail"

      - name: Verify manifest.json release asset is byte-identical
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          gh release download "$TAG" -p 'manifest.json' -D "$tmpdir"
          if ! cmp -s "${tmpdir}/manifest.json" bin/manifest.json; then
            echo "::error::released manifest.json differs from git-tracked bin/manifest.json"
            rm -rf "$tmpdir"
            exit 1
          fi
          rm -rf "$tmpdir"

      # TRDD-PHQHS58T: every release asset carries a keyless sigstore bundle
      # produced by the sign-release job in build-binaries.yml (signing the
      # release's OWN bytes — CI artifacts are a different byte-set from the
      # laptop-built release files). The signer identity is pinned to the
      # tag-triggered run's ref (refs/tags/<tag>), the only job that runs
      # then. Fail-closed for signed manifests: flagged releases without
      # bundles are an ERROR, not a skip.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify keyless signatures on all binary assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # FAIL-OPEN GUARD: a release whose manifest declares signed: true
          # MUST have bundles — absence is a failure, never a skip. Only a
          # manifest without the flag (pre-PHQHS58T releases like v3.16.0)
          # skips, so the nightly stays quiet on legacy tags while every
          # signed release is positively verified or loudly red. Stripping
          # the flag to dodge verification is itself caught: the released
          # manifest must stay byte-identical to the git-tracked one (the
          # step above), and tampering the tracked one is a git-visible
          # commit — outside this card's post-publish-asset-swap threat.
          if jq -e '.signed == true' bin/manifest.json > /dev/null; then
            require_bundles=1
          else
            require_bundles=0
            echo "::notice::manifest does not declare signed:true (pre-PHQHS58T release) — skipping signature verification"
          fi
          # Bundles are RELEASE ASSETS (uploaded by the sign-release job of
          # build-binaries.yml), so they live as long as the release itself.
          tmpdir="$(mktemp -d)"
          gh release download "$TAG" -p '*.sigstore.json' -D "$tmpdir" 2>/dev/null || true
          if [ -z "$(ls -A "$tmpdir" 2>/dev/null)" ]; then
            if [ "$require_bundles" -eq 1 ]; then
              echo "::error::manifest declares signed:true but no sigstore bundles exist for ${TAG} — signing job missing, failed, or bundles stripped"
              rm -rf "$tmpdir"
              exit 1
            fi
            echo "::notice::no bundles for ${TAG} — nothing to verify"
            rm -rf "$tmpdir"
            exit 0
          fi
          fail=0
          while IFS= read -r name; do
            gh release download "$TAG" -p "${name}" -D "$tmpdir" 2>/dev/null || true
            [ -f "${tmpdir}/${name}.sigstore.json" ] \
              || { echo "::error::${name}: signature bundle missing from the release"; fail=1; continue; }
            if ! cosign verify-blob \
                  "${tmpdir}/${name}" \
                  --bundle "${tmpdir}/${name}.sigstore.json" \
                  --certificate-identity-regexp \
                    "^https://github\.com/Emasoft/perfect-skill-suggester/\.github/workflows/build-binaries\.yml@refs/tags/${TAG}$" \
                  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                  >/dev/null 2>&1; then
              echo "::error::${name}: cosign keyless verification failed"
              fail=1
            fi
          done < <(jq -r '.binaries | keys[]' bin/manifest.json)
          rm -rf "$tmpdir"
          exit "$fail"

      - name: Run the fetcher end-to-end against the real release
        shell: bash
        run: |
          set -euo pipefail
          TMPHOME="$(mktemp -d)"
          unset CLAUDE_PLUGIN_DATA

          HOME="$TMPHOME" uv run python scripts/pss_fetch_binaries.py

          engine_name="$(jq -r --arg os "linux" --arg arch "x86_64" \
            '.binaries | keys[] | select(startswith("pss-") and (contains("nlp") | not) and contains($os) and contains($arch))' \
            bin/manifest.json)"
          nlp_name="$(jq -r --arg os "linux" --arg arch "x86_64" \
            '.binaries | keys[] | select(startswith("pss-nlp-") and contains($os) and contains($arch))' \
            bin/manifest.json)"

          store="${TMPHOME}/.claude/cache/bin"

          for name in "$engine_name" "$nlp_name"; do
            fetched="${store}/current/${name}"
            if [ ! -e "$fetched" ]; then
              echo "::error::fetcher did not publish ${fetched}"
              exit 1
            fi
            if [ ! -x "$fetched" ]; then
              echo "::error::${fetched} is not executable"
              exit 1
            fi
            expected_sha="$(jq -r --arg n "$name" '.binaries[$n].sha256' bin/manifest.json)"
            actual_sha="$(sha256sum "$fetched" | awk '{print $1}')"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::${fetched} sha256 mismatch (expected ${expected_sha}, got ${actual_sha})"
              exit 1
            fi
          done

          status="$(jq -r '.status' "${store}/.state.json")"
          if [ "$status" != "ok" ]; then
            echo "::error::fetcher .state.json status is '${status}', expected 'ok'"
            exit 1
          fi

          rm -rf "$TMPHOME"
